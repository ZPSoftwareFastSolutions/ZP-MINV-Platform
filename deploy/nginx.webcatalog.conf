# M-INV V6/V7 · nginx del catálogo web (imagen minv-webcatalog). Sirve la web estática (tienda + panel) y, en la red interna
# de Docker, reenvía:
#   /storefront/    → API Gateway      (tienda pública: catálogo, imágenes, reservas; principal técnico tienda-web)
#   /api/v1/web/    → servidor en la nube (V7: sesión web por cookie, registro de clientes y RPC del panel)
# La web se construye con VITE_API_URL=/ (mismo origen): UN solo enlace público (el túnel de Cloudflare) sirve la web y sus
# dos API, sin CORS. Nada más sale a internet: ni /docs ni la API B2B /v1 del gateway, ni las rutas del escritorio
# (/api/v1/session/*, /api/v1/rpc) del servidor en la nube (regla P-11).

# IP real del cliente para los límites por IP: la que pone Cloudflare (Cf-Connecting-IP; el borde la sobrescribe, un visitante
# no puede falsearla a través del túnel) o, en acceso local, la de la conexión. Los puertos del contenedor solo escuchan en
# 127.0.0.1 del equipo, así que a nginx solo llegan el túnel y este equipo.
map $http_cf_connecting_ip $minv_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# V7 · Esquema con que el visitante llegó: el túnel entrega https en X-Forwarded-Proto (nginx escucha en http detrás de él).
# El servidor en la nube lo usa para marcar la cookie de sesión como Secure; en acceso local directo queda el de la conexión.
map $http_x_forwarded_proto $minv_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad (regla P-11). Se declaran SOLO aquí: ningún location usa add_header (si lo hiciera, dejaría de
    # heredar estas). La caché de cada location se fija con «expires».
    # CSP: todo desde el propio sitio; las fuentes Inter y Space Grotesk salen de Google Fonts (V5); estilos en línea para los
    # componentes; imágenes data:/blob: para las miniaturas que el panel reduce antes de subir.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self' blob:" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    # Resolución diferida: nginx arranca aunque los servidores todavía no estén listos (Docker los resuelve en 127.0.0.11)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $minv_gateway http://apigateway:8080;
    set $minv_cloud http://cloudserver:8080;

    # API pública de tienda (catálogo, imágenes, armados y reservas). Solo /storefront/: /docs y /v1 no se publican.
    location /storefront/ {
        proxy_pass $minv_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $minv_client_ip;
        proxy_set_header X-Forwarded-Proto $minv_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # V7 · Sesión web, registro de clientes y RPC del panel del personal. El cuerpo admite 4 MB: una imagen de producto de
    # hasta 1 MB viaja en base64 dentro del RPC. Reportes y cierres pueden tardar: 120 s de lectura.
    location /api/v1/web/ {
        proxy_pass $minv_cloud;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $minv_client_ip;
        proxy_set_header X-Forwarded-Proto $minv_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        client_max_body_size 4m;
        expires -1;
    }

    # Cualquier otra ruta de API NO se publica (las del escritorio viven solo en 127.0.0.1:5080)
    location /api/ {
        return 404;
    }

    # Archivos con huella en el nombre: caché larga
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Aplicación de una sola página (React Router): toda ruta sirve index.html, siempre fresco
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
