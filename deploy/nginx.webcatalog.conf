# M-INV V6 · nginx del catálogo web (imagen minv-webcatalog). Sirve la web estática y reenvía la API pública de tienda
# (/storefront/) al API Gateway de la red interna de Docker: la web se construye con VITE_API_URL=/ (mismo origen), así UN
# solo enlace público (el túnel de Cloudflare) sirve la web y su API, sin CORS.

# IP real del cliente para el límite por IP del gateway: la que pone Cloudflare (Cf-Connecting-IP; el borde de Cloudflare la
# sobrescribe, un visitante no puede falsearla a través del túnel) o, en acceso local, la de la conexión.
map $http_cf_connecting_ip $minv_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Resolución diferida: nginx arranca aunque el gateway todavía no esté listo (Docker lo resuelve en 127.0.0.11)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $minv_gateway http://apigateway:8080;

    # API pública de tienda (catálogo, imágenes, armados y reservas). Solo /storefront/: /docs y /v1 no se publican.
    location /storefront/ {
        proxy_pass $minv_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $minv_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Archivos con huella en el nombre: caché larga
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Aplicación de una sola página (React Router): toda ruta sirve index.html, siempre fresco
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
